name: Authenticated E2E

on:
  workflow_dispatch:
  pull_request:

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run authenticated visual regression
        if: env.E2E_EMAIL != '' && env.E2E_PASSWORD != ''
        run: npm run test:e2e
      - name: Explain skipped authenticated run
        if: env.E2E_EMAIL == '' || env.E2E_PASSWORD == ''
        run: echo "Authenticated E2E skipped because repository secrets are not configured."
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
