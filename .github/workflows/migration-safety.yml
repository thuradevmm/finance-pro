name: Migration Safety

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  migration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Supabase migrations
        run: npm run db:migration:check

      - name: Test financial logic
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start isolated Supabase
        run: npm run db:start:ci

      - name: Capture Supabase startup diagnostics
        if: failure()
        run: |
          {
            echo "### Supabase startup diagnostics"
            echo '```text'
            docker ps -a
            for container in $(docker ps -aq --filter "name=supabase_"); do
              echo
              echo "== $(docker inspect --format '{{.Name}}' "$container") =="
              docker logs --tail 120 "$container" 2>&1
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Replay all migrations from zero
        run: npm run db:local:reset:ci

      - name: Stop isolated Supabase
        if: always()
        run: npm run db:stop -- --no-backup
