name: Migration Safety

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  migration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Supabase migrations
        run: npm run db:migration:check

      - name: Test financial logic
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start isolated Supabase
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Supabase database start attempt $attempt of 3" | tee -a "$RUNNER_TEMP/supabase-start.log"
            if npm run db:start:ci 2>&1 | tee -a "$RUNNER_TEMP/supabase-start.log"; then
              exit 0
            fi
            if test "$attempt" -lt 3; then
              echo "Registry pull failed; preserving downloaded layers and retrying in 20 seconds." | tee -a "$RUNNER_TEMP/supabase-start.log"
              sleep 20
            fi
          done
          exit 1

      - name: Capture Supabase startup diagnostics
        if: failure()
        run: |
          diagnostic_file="$RUNNER_TEMP/supabase-startup-diagnostics.txt"
          {
            if test -f "$RUNNER_TEMP/supabase-start.log"; then
              echo "== Supabase CLI =="
              tail -n 160 "$RUNNER_TEMP/supabase-start.log"
              echo
            fi
            docker ps -a
            for container in $(docker ps -aq --filter "name=supabase_"); do
              echo
              echo "== $(docker inspect --format '{{.Name}}' "$container") =="
              docker logs --tail 120 "$container" 2>&1
            done
          } > "$diagnostic_file"
          {
            echo "### Supabase startup diagnostics"
            echo '```text'
            cat "$diagnostic_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          annotation_file="$RUNNER_TEMP/supabase-startup-errors.txt"
          tail -n 80 "$diagnostic_file" > "$annotation_file"
          node -e 'const fs = require("node:fs"); const text = fs.readFileSync(process.argv[1], "utf8").slice(-3500).replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A"); console.log(`::error title=Supabase startup diagnostics::${text}`)' "$annotation_file"

      - name: Replay all migrations from zero
        run: npm run db:local:reset:ci

      - name: Stop isolated Supabase
        if: always()
        run: npm run db:stop -- --no-backup
